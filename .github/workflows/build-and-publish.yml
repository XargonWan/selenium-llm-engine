name: "Zen LLM Engine - Build and Publish"

on:
  push:
    branches: ["main", "develop", "release/**", "feat/**", "fix/**"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      TAG: ${{ steps.version.outputs.TAG }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Get short commit
        id: version
        run: |
          TAG="${GITHUB_SHA:0:7}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_RUN_ID}"
          fi
          if [ -z "$TAG" ]; then
            TAG="$(date +%s)"
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

build-and-push:
     needs: prepare
     runs-on: ubuntu-latest
     permissions:
       contents: read
       packages: write
       id-token: write
     strategy:
       matrix:
         include:
           - arch: amd64
             platform: linux/amd64
           - arch: arm64
             platform: linux/arm64
     env:
       IMAGE_NAME_ZEN: ${{ secrets.DOCKERHUB_USERNAME }}/zen-llm-engine
       IMAGE_NAME_SELENIUM: ${{ secrets.DOCKERHUB_USERNAME }}/selenium-llm-engine
       IMAGE_TAG: ${{ needs.prepare.outputs.TAG || github.run_id }}
     steps:
       - uses: actions/checkout@v5
         with:
           fetch-depth: 0

       - name: Validate image parameters
         run: |
           if [ -z "$IMAGE_NAME_ZEN" ] || [ -z "$IMAGE_TAG" ]; then
             echo "IMAGE_NAME_ZEN or IMAGE_TAG is empty" >&2
             exit 1
           fi
         env:
           IMAGE_NAME_ZEN: ${{ env.IMAGE_NAME_ZEN }}
           IMAGE_TAG: ${{ env.IMAGE_TAG }}

       - name: Log in to Docker Hub
         uses: docker/login-action@v3
         with:
           username: ${{ secrets.DOCKERHUB_USERNAME }}
           password: ${{ secrets.DOCKERHUB_TOKEN }}

       - name: Set up Docker Buildx
         uses: docker/setup-buildx-action@v3

       - name: Build and push image for ${{ matrix.arch }}
         id: build
         uses: docker/build-push-action@v6
         with:
           context: .
           platforms: ${{ matrix.platform }}
           push: true
           tags: |
             ${{ env.IMAGE_NAME_ZEN }}:${{ env.IMAGE_TAG }}-${{ matrix.arch }}
             ${{ env.IMAGE_NAME_SELENIUM }}:${{ env.IMAGE_TAG }}-${{ matrix.arch }}
           cache-from: type=gha
           cache-to: type=gha,mode=max
           build-args: |
             TARGETARCH=${{ matrix.arch }}

       - name: Save image digest artifact
         run: |
           echo "${{ steps.build.outputs.digest }}" > digest-${{ matrix.arch }}
       - uses: actions/upload-artifact@v5
         with:
           name: digest-${{ matrix.arch }}
           path: digest-${{ matrix.arch }}

   create-manifest:
     needs: [prepare, build-and-push]
     runs-on: ubuntu-latest
     env:
       IMAGE_NAME_ZEN: ${{ secrets.DOCKERHUB_USERNAME }}/zen-llm-engine
       IMAGE_NAME_SELENIUM: ${{ secrets.DOCKERHUB_USERNAME }}/selenium-llm-engine
       IMAGE_TAG: ${{ needs.prepare.outputs.TAG || github.run_id }}
     steps:
       - name: Log in to Docker Hub
         uses: docker/login-action@v3
         with:
           username: ${{ secrets.DOCKERHUB_USERNAME }}
           password: ${{ secrets.DOCKERHUB_TOKEN }}

       - name: Set up Docker Buildx
         uses: docker/setup-buildx-action@v3

       - name: Create and push multi-arch manifest (zen-llm-engine)
         run: |
           docker buildx imagetools create \
             --tag "$IMAGE_NAME_ZEN:$IMAGE_TAG" \
             --tag "$IMAGE_NAME_ZEN:latest" \
             "$IMAGE_NAME_ZEN:$IMAGE_TAG-amd64" \
             "$IMAGE_NAME_ZEN:$IMAGE_TAG-arm64"

       - name: Create and push multi-arch manifest (selenium-llm-engine, legacy)
         run: |
           docker buildx imagetools create \
             --tag "$IMAGE_NAME_SELENIUM:$IMAGE_TAG" \
             --tag "$IMAGE_NAME_SELENIUM:latest" \
             "$IMAGE_NAME_SELENIUM:$IMAGE_TAG-amd64" \
             "$IMAGE_NAME_SELENIUM:$IMAGE_TAG-arm64"

  tests:
    needs: build-and-push
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
